<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <rect width="1000" height="600" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">从零复刻的八个阶段</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">按依赖顺序排列，不是按重要性</text>

  <!-- 时间刻度：0-33 天映射到 200-940 -->
  <g font-size="10" fill="#94a3b8" text-anchor="middle">
    <text x="200" y="96">0</text>
    <text x="312" y="96">5 天</text>
    <text x="424" y="96">10 天</text>
    <text x="536" y="96">15 天</text>
    <text x="648" y="96">20 天</text>
    <text x="760" y="96">25 天</text>
    <text x="872" y="96">30 天</text>
  </g>
  <line x1="200" y1="104" x2="940" y2="104" stroke="#e2e8f0" stroke-width="1.2"/>
  <g stroke="#f1f5f9" stroke-width="1">
    <line x1="312" y1="104" x2="312" y2="500"/>
    <line x1="424" y1="104" x2="424" y2="500"/>
    <line x1="536" y1="104" x2="536" y2="500"/>
    <line x1="648" y1="104" x2="648" y2="500"/>
    <line x1="760" y1="104" x2="760" y2="500"/>
    <line x1="872" y1="104" x2="872" y2="500"/>
  </g>

  <!-- 0 准备 0-0.5 -->
  <text x="60" y="136" font-size="12" font-weight="600" fill="#0f172a">0 准备</text>
  <rect x="200" y="122" width="12" height="22" rx="4" fill="#93c5fd"/>
  <text x="220" y="138" font-size="10" fill="#64748b">0.5 天</text>

  <!-- 1 规格 0.5-2 -->
  <text x="60" y="178" font-size="12" font-weight="600" fill="#0f172a">1 规格层</text>
  <rect x="212" y="164" width="34" height="22" rx="4" fill="#60a5fa"/>
  <text x="254" y="180" font-size="10" fill="#64748b">1.5 天</text>

  <!-- 2 最小 CLI 2-4.5 -->
  <text x="60" y="220" font-size="12" font-weight="600" fill="#0f172a">2 最小 CLI</text>
  <rect x="246" y="206" width="56" height="22" rx="4" fill="#3b82f6"/>
  <text x="310" y="222" font-size="10" fill="#64748b">2.5 天</text>

  <!-- 3 传输层 4.5-8.5 -->
  <text x="60" y="262" font-size="12" font-weight="600" fill="#0f172a">3 传输层</text>
  <rect x="302" y="248" width="90" height="22" rx="4" fill="#2563eb"/>
  <text x="400" y="264" font-size="10" fill="#64748b">4 天</text>

  <!-- 4 输出层 8.5-10.5 -->
  <text x="60" y="304" font-size="12" font-weight="600" fill="#0f172a">4 输出层</text>
  <rect x="392" y="290" width="45" height="22" rx="4" fill="#1d4ed8"/>
  <text x="445" y="306" font-size="10" fill="#64748b">2 天</text>

  <!-- 6 MCP 10.5-13 -->
  <text x="60" y="346" font-size="12" font-weight="600" fill="#0f172a">6 MCP 层</text>
  <rect x="437" y="332" width="56" height="22" rx="4" fill="#7c3aed"/>
  <text x="501" y="348" font-size="10" fill="#64748b">2.5 天</text>

  <!-- 5 生成器 13-20 -->
  <text x="60" y="388" font-size="12" font-weight="600" fill="#0f172a">5 生成器</text>
  <rect x="493" y="374" width="157" height="22" rx="4" fill="#94a3b8"/>
  <text x="658" y="390" font-size="10" fill="#64748b">7 天</text>

  <!-- 7 本地存储 20-26 -->
  <text x="60" y="430" font-size="12" font-weight="600" fill="#0f172a">7 本地存储</text>
  <rect x="650" y="416" width="134" height="22" rx="4" fill="#cbd5e1"/>
  <text x="792" y="432" font-size="10" fill="#64748b">6 天</text>

  <!-- 8 学习系统 26-31 -->
  <text x="60" y="472" font-size="12" font-weight="600" fill="#0f172a">8 学习系统</text>
  <rect x="784" y="458" width="112" height="22" rx="4" fill="#e2e8f0"/>
  <text x="904" y="474" font-size="10" fill="#64748b">5 天+</text>

  <!-- MVP 标记：0-13 天 -->
  <rect x="200" y="504" width="293" height="26" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1.1"/>
  <text x="346" y="522" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">MVP：阶段 0-4 + 6，约 9-13 天</text>

  <text x="660" y="522" font-size="11" fill="#94a3b8">灰色部分可按需延后</text>

  <!-- 提示 -->
  <text x="500" y="570" text-anchor="middle" font-size="11.5" fill="#64748b">不要一开始就做学习系统：它最有想象力，也最容易做错</text>
</svg>

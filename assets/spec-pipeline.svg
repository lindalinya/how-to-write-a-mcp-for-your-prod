<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <filter id="s2" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f0fdf4"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="640" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">规格驱动的生成流水线</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">改一条规格，五种产物同步更新</text>

  <!-- 规格 -->
  <rect x="50" y="180" width="230" height="210" rx="12" fill="url(#g2)" stroke="#16a34a" stroke-width="1.6" filter="url(#s2)"/>
  <text x="165" y="212" text-anchor="middle" font-size="15" font-weight="700" fill="#14532d">endpoints.yaml</text>
  <line x1="70" y1="228" x2="260" y2="228" stroke="#86efac" stroke-width="1"/>
  <g font-size="12" fill="#166534" font-family="'SFMono-Regular', Consolas, monospace">
    <text x="72" y="252">endpoint: dashboards.list</text>
    <text x="72" y="274">method: GET</text>
    <text x="72" y="296">path: /api/v2/dashboards</text>
    <text x="72" y="318">params: [...]</text>
    <text x="72" y="340">annotations:</text>
    <text x="88" y="362">mcp:read-only: true</text>
  </g>

  <!-- 箭头 -->
  <path d="M 280 285 L 348 285" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#a2)"/>

  <!-- 生成器 -->
  <rect x="352" y="225" width="180" height="120" rx="12" fill="#1e293b" stroke="#0f172a" stroke-width="1.4" filter="url(#s2)"/>
  <text x="442" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="#f8fafc">生成器</text>
  <text x="442" y="288" text-anchor="middle" font-size="11.5" fill="#cbd5e1">tools/gen</text>
  <text x="442" y="312" text-anchor="middle" font-size="11.5" fill="#94a3b8">模板 + 校验</text>

  <!-- 分支箭头 -->
  <path d="M 532 285 L 578 285" stroke="#64748b" stroke-width="1.8" fill="none"/>
  <path d="M 578 285 L 578 105" stroke="#64748b" stroke-width="1.8" fill="none"/>
  <path d="M 578 105 L 578 465" stroke="#64748b" stroke-width="1.8" fill="none"/>
  <path d="M 578 105 L 620 105" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#a2)"/>
  <path d="M 578 195 L 620 195" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#a2)"/>
  <path d="M 578 285 L 620 285" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#a2)"/>
  <path d="M 578 375 L 620 375" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#a2)"/>
  <path d="M 578 465 L 620 465" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#a2)"/>

  <!-- 五产物 -->
  <g filter="url(#s2)">
    <rect x="624" y="76" width="330" height="58" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
    <rect x="624" y="166" width="330" height="58" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
    <rect x="624" y="256" width="330" height="58" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
    <rect x="624" y="346" width="330" height="58" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
    <rect x="624" y="436" width="330" height="58" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  </g>
  <rect x="624" y="76" width="5" height="58" rx="2.5" fill="#2563eb"/>
  <rect x="624" y="166" width="5" height="58" rx="2.5" fill="#7c3aed"/>
  <rect x="624" y="256" width="5" height="58" rx="2.5" fill="#d97706"/>
  <rect x="624" y="346" width="5" height="58" rx="2.5" fill="#059669"/>
  <rect x="624" y="436" width="5" height="58" rx="2.5" fill="#dc2626"/>

  <g font-size="13.5" font-weight="600" fill="#0f172a">
    <text x="646" y="101">CLI 命令定义</text>
    <text x="646" y="191">MCP 工具定义</text>
    <text x="646" y="281">参数校验逻辑</text>
    <text x="646" y="371">帮助文本 / 文档</text>
    <text x="646" y="461">agent-context 命令树</text>
  </g>
  <g font-size="11.5" fill="#64748b">
    <text x="646" y="120">cobra 命令 + flags</text>
    <text x="646" y="210">name / description / inputSchema</text>
    <text x="646" y="300">必填、类型、枚举</text>
    <text x="646" y="390">--help 与外部文档</text>
    <text x="646" y="480">AI 一次拿全的说明书</text>
  </g>

  <!-- 底部 CI -->
  <rect x="250" y="556" width="500" height="54" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.3"/>
  <text x="500" y="588" text-anchor="middle" font-size="12.5" fill="#991b1b">CI：规格变了但生成物没更新 → 直接失败</text>
</svg>

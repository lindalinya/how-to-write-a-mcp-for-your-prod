<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="s8" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1000" height="680" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">命令树的结构</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">524 个节点 = 321 个叶子 + 60 个分组 + 顶层入口</text>

  <!-- root -->
  <rect x="390" y="86" width="220" height="52" rx="10" fill="#1e293b" stroke="#0f172a" stroke-width="1.4" filter="url(#s8)"/>
  <text x="500" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#f8fafc">mycli</text>

  <!-- 分支线 -->
  <path d="M 500 138 L 500 158" stroke="#94a3b8" stroke-width="1.6" fill="none"/>
  <path d="M 130 158 L 870 158" stroke="#94a3b8" stroke-width="1.6" fill="none"/>
  <g stroke="#94a3b8" stroke-width="1.6" fill="none">
    <path d="M 130 158 L 130 186"/>
    <path d="M 370 158 L 370 186"/>
    <path d="M 610 158 L 610 186"/>
    <path d="M 850 158 L 850 186"/>
  </g>

  <!-- 四个一级分组 -->
  <g filter="url(#s8)">
    <rect x="40" y="190" width="180" height="76" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.3"/>
    <rect x="280" y="190" width="180" height="76" rx="10" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.3"/>
    <rect x="520" y="190" width="180" height="76" rx="10" fill="#f0fdf4" stroke="#86efac" stroke-width="1.3"/>
    <rect x="760" y="190" width="180" height="76" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.3"/>
  </g>
  <g text-anchor="middle">
    <text x="130" y="218" font-size="12.5" font-weight="700" fill="#1e3a8a">BI &amp; Content</text>
    <text x="130" y="240" font-size="11" fill="#3b82f6">11 个 · 看板 / 报表 / 数据</text>

    <text x="370" y="218" font-size="12.5" font-weight="700" fill="#4c1d95">Admin &amp; Platform</text>
    <text x="370" y="240" font-size="11" fill="#7c3aed">8 个 · 用户 / 调度 / 主题</text>

    <text x="610" y="218" font-size="12.5" font-weight="700" fill="#14532d">Instance &amp; Local</text>
    <text x="610" y="240" font-size="11" fill="#16a34a">9 个 · 实例 / 同步 / 搜索</text>

    <text x="850" y="218" font-size="12.5" font-weight="700" fill="#7c2d12">Agent &amp; Utility</text>
    <text x="850" y="240" font-size="11" fill="#ea580c">10 个 · 发现 / 配置 / 帮助</text>
  </g>

  <!-- 展开第一个分组 -->
  <path d="M 130 266 L 130 300" stroke="#3b82f6" stroke-width="1.6" fill="none"/>
  <rect x="40" y="304" width="180" height="48" rx="9" fill="#ffffff" stroke="#93c5fd" stroke-width="1.3"/>
  <text x="130" y="334" text-anchor="middle" font-size="12.5" font-weight="600" fill="#1e40af">dashboards</text>
  <text x="232" y="334" font-size="10.5" fill="#64748b">分组</text>

  <path d="M 130 352 L 130 376" stroke="#3b82f6" stroke-width="1.6" fill="none"/>
  <path d="M 70 376 L 190 376" stroke="#3b82f6" stroke-width="1.6" fill="none"/>
  <g stroke="#3b82f6" stroke-width="1.6" fill="none">
    <path d="M 70 376 L 70 400"/>
    <path d="M 130 376 L 130 400"/>
    <path d="M 190 376 L 190 400"/>
  </g>

  <g filter="url(#s8)">
    <rect x="28" y="404" width="84" height="44" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
    <rect x="130" y="404" width="84" height="44" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
    <rect x="232" y="404" width="84" height="44" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/>
  </g>
  <g text-anchor="middle" font-size="11.5" fill="#1e40af">
    <text x="70" y="424">list</text>
    <text x="70" y="440" font-size="9.5" fill="#64748b">GET</text>
    <text x="172" y="424">create</text>
    <text x="172" y="440" font-size="9.5" fill="#64748b">POST</text>
    <text x="274" y="424">delete</text>
    <text x="274" y="440" font-size="9.5" fill="#64748b">DELETE</text>
  </g>

  <!-- 右侧规则 -->
  <rect x="540" y="300" width="420" height="230" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.2"/>
  <text x="562" y="330" font-size="13.5" font-weight="700" fill="#0f172a">结构规则</text>
  <g font-size="11.5" fill="#475569">
    <text x="562" y="358">· 叶子深度 ≤ 4 层</text>
    <text x="562" y="382">· 命名：资源 + 动词（dashboards create）</text>
    <text x="562" y="406">· 分组节点不可直接执行业务</text>
    <text x="562" y="430">· 高频操作可提升为顶层快捷方式</text>
    <text x="562" y="454">· 全局参数只在 root 定义一次</text>
    <text x="562" y="478">· 每层都可用 --help 查看</text>
  </g>
  <line x1="562" y1="496" x2="938" y2="496" stroke="#e2e8f0"/>
  <text x="562" y="518" font-size="11" fill="#94a3b8">示例：mycli dashboards list --json</text>

  <!-- 底部统计 -->
  <g>
    <rect x="40" y="560" width="200" height="70" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="140" y="588" text-anchor="middle" font-size="22" font-weight="800" fill="#1e3a8a">524</text>
    <text x="140" y="610" text-anchor="middle" font-size="11" fill="#3b82f6">全部节点</text>

    <rect x="260" y="560" width="200" height="70" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="360" y="588" text-anchor="middle" font-size="22" font-weight="800" fill="#14532d">321</text>
    <text x="360" y="610" text-anchor="middle" font-size="11" fill="#16a34a">真实 API 叶子</text>

    <rect x="480" y="560" width="200" height="70" rx="10" fill="#f5f3ff" stroke="#ddd6fe"/>
    <text x="580" y="588" text-anchor="middle" font-size="22" font-weight="800" fill="#4c1d95">60</text>
    <text x="580" y="610" text-anchor="middle" font-size="11" fill="#7c3aed">分组节点</text>

    <rect x="700" y="560" width="260" height="70" rx="10" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="830" y="588" text-anchor="middle" font-size="22" font-weight="800" fill="#7c2d12">38</text>
    <text x="830" y="610" text-anchor="middle" font-size="11" fill="#ea580c">顶层命令</text>
  </g>
</svg>

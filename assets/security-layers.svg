<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <defs>
    <filter id="s14" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1000" height="620" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">安全控制的四道防线</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">从外到内，每一层独立生效</text>

  <!-- 第一层 -->
  <rect x="40" y="88" width="920" height="104" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.3" filter="url(#s14)"/>
  <rect x="40" y="88" width="150" height="104" rx="12" fill="#2563eb"/>
  <text x="115" y="128" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">网络层</text>
  <text x="115" y="152" text-anchor="middle" font-size="10.5" fill="#dbeafe">出站请求</text>
  <g font-size="11.5" fill="#1e3a8a">
    <text x="212" y="120">· 重定向白名单：拒绝内网地址、拒绝 https→http、拒绝非 http(s)</text>
    <text x="212" y="144">· 跨域重定向删除 Authorization 头</text>
    <text x="212" y="168">· DNS 解析后校验 IP（防 rebinding），拦截云元数据地址</text>
  </g>
  <text x="930" y="120" text-anchor="end" font-size="10.5" fill="#3b82f6">防 SSRF</text>

  <!-- 第二层 -->
  <rect x="40" y="208" width="920" height="104" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.3" filter="url(#s14)"/>
  <rect x="40" y="208" width="150" height="104" rx="12" fill="#16a34a"/>
  <text x="115" y="248" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">凭证层</text>
  <text x="115" y="272" text-anchor="middle" font-size="10.5" fill="#dcfce7">token / 密码</text>
  <g font-size="11.5" fill="#14532d">
    <text x="212" y="240">· 环境变量优先于配置文件；原子写 + 0600 权限</text>
    <text x="212" y="264">· 占位符检测，错误里给出配置路径</text>
    <text x="212" y="288">· 拒绝把「像凭证的参数」写入 profile</text>
  </g>
  <text x="930" y="240" text-anchor="end" font-size="10.5" fill="#16a34a">防泄露</text>

  <!-- 第三层 -->
  <rect x="40" y="328" width="920" height="104" rx="12" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.3" filter="url(#s14)"/>
  <rect x="40" y="328" width="150" height="104" rx="12" fill="#ea580c"/>
  <text x="115" y="368" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">数据层</text>
  <text x="115" y="392" text-anchor="middle" font-size="10.5" fill="#ffedd5">本地镜像</text>
  <g font-size="11.5" fill="#7c2d12">
    <text x="212" y="360">· 租户指纹：expected_identity 与 observed_identity 不一致即拒绝</text>
    <text x="212" y="384">· 只读连接 + query_only，用户 SQL 无法写入</text>
    <text x="212" y="408">· 解压后响应体上限，HTML 错误页只取标题</text>
  </g>
  <text x="930" y="360" text-anchor="end" font-size="10.5" fill="#ea580c">防串租户 / 防炸弹</text>

  <!-- 第四层 -->
  <rect x="40" y="448" width="920" height="104" rx="12" fill="#f5f3ff" stroke="#ddd6fe" stroke-width="1.3" filter="url(#s14)"/>
  <rect x="40" y="448" width="150" height="104" rx="12" fill="#7c3aed"/>
  <text x="115" y="488" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">AI 层</text>
  <text x="115" y="512" text-anchor="middle" font-size="10.5" fill="#ede9fe">工具调用</text>
  <g font-size="11.5" fill="#4c1d95">
    <text x="212" y="480">· readOnlyHint / destructiveHint 标注每个工具的副作用</text>
    <text x="212" y="504">· --dry-run 预演；危险操作要求显式确认</text>
    <text x="212" y="528">· 自动学到的知识先进候选区，人工确认才生效</text>
  </g>
  <text x="930" y="480" text-anchor="end" font-size="10.5" fill="#7c3aed">防误删 / 防污染</text>

  <!-- 底部 -->
  <text x="500" y="590" text-anchor="middle" font-size="11.5" fill="#64748b">现有短板：配置文件中的密码与 token 仍是明文，建议至少在共享机器上收紧文件权限或改用环境变量</text>
</svg>

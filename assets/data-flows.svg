<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <filter id="s4" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="1000" height="700" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">三条必须分清的数据流</text>
  <text x="500" y="58" text-anchor="middle" font-size="13" fill="#64748b">混淆它们是最常见的架构错误</text>

  <!-- 泳道 A -->
  <rect x="30" y="86" width="940" height="160" rx="14" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.2"/>
  <text x="56" y="116" font-size="14.5" font-weight="700" fill="#1e3a8a">A · 实时读</text>
  <text x="56" y="138" font-size="11.5" fill="#3b82f6">--data-source live</text>
  <g filter="url(#s4)">
    <rect x="190" y="120" width="120" height="56" rx="9" fill="#ffffff" stroke="#93c5fd"/>
    <rect x="350" y="120" width="120" height="56" rx="9" fill="#ffffff" stroke="#93c5fd"/>
    <rect x="510" y="120" width="120" height="56" rx="9" fill="#ffffff" stroke="#93c5fd"/>
    <rect x="670" y="120" width="120" height="56" rx="9" fill="#ffffff" stroke="#93c5fd"/>
    <rect x="830" y="120" width="120" height="56" rx="9" fill="#ffffff" stroke="#93c5fd"/>
  </g>
  <g font-size="12.5" fill="#1e3a8a" text-anchor="middle" font-weight="600">
    <text x="250" y="153">命令</text>
    <text x="410" y="153">client</text>
    <text x="570" y="153">HTTP</text>
    <text x="730" y="153">格式化</text>
    <text x="890" y="153">输出</text>
  </g>
  <g stroke="#64748b" stroke-width="1.6" marker-end="url(#a4)">
    <line x1="310" y1="148" x2="344" y2="148"/>
    <line x1="470" y1="148" x2="504" y2="148"/>
    <line x1="630" y1="148" x2="664" y2="148"/>
    <line x1="790" y1="148" x2="824" y2="148"/>
  </g>
  <text x="190" y="208" font-size="11.5" fill="#64748b">不经过本地库，永远拿最新数据</text>

  <!-- 泳道 B -->
  <rect x="30" y="266" width="940" height="190" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.2"/>
  <text x="56" y="296" font-size="14.5" font-weight="700" fill="#14532d">B · 镜像读</text>
  <text x="56" y="318" font-size="11.5" fill="#16a34a">--data-source local / auto</text>

  <!-- 上半：同步 -->
  <g filter="url(#s4)">
    <rect x="190" y="298" width="120" height="52" rx="9" fill="#ffffff" stroke="#86efac"/>
    <rect x="350" y="298" width="120" height="52" rx="9" fill="#ffffff" stroke="#86efac"/>
    <rect x="510" y="298" width="120" height="52" rx="9" fill="#ffffff" stroke="#86efac"/>
    <rect x="670" y="298" width="140" height="52" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  </g>
  <g font-size="12.5" fill="#14532d" text-anchor="middle" font-weight="600">
    <text x="250" y="329">sync 命令</text>
    <text x="410" y="329">client</text>
    <text x="570" y="329">HTTP</text>
    <text x="740" y="329">SQLite + FTS5</text>
  </g>
  <g stroke="#16a34a" stroke-width="1.6" marker-end="url(#a4)">
    <line x1="310" y1="324" x2="344" y2="324"/>
    <line x1="470" y1="324" x2="504" y2="324"/>
    <line x1="630" y1="324" x2="664" y2="324"/>
  </g>

  <!-- 下半：读取 -->
  <g filter="url(#s4)">
    <rect x="190" y="382" width="120" height="52" rx="9" fill="#ffffff" stroke="#86efac"/>
    <rect x="350" y="382" width="140" height="52" rx="9" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="530" y="382" width="120" height="52" rx="9" fill="#ffffff" stroke="#86efac"/>
    <rect x="690" y="382" width="120" height="52" rx="9" fill="#ffffff" stroke="#86efac"/>
  </g>
  <g font-size="12.5" fill="#14532d" text-anchor="middle" font-weight="600">
    <text x="250" y="413">命令</text>
    <text x="420" y="413">SQLite + FTS5</text>
    <text x="590" y="413">格式化</text>
    <text x="750" y="413">输出</text>
  </g>
  <g stroke="#16a34a" stroke-width="1.6" marker-end="url(#a4)">
    <line x1="310" y1="408" x2="344" y2="408"/>
    <line x1="490" y1="408" x2="524" y2="408"/>
    <line x1="650" y1="408" x2="684" y2="408"/>
  </g>
  <text x="190" y="450" font-size="11.5" fill="#64748b">断网可用；--data-source local 时绝不回退到网络</text>

  <!-- 泳道 C -->
  <rect x="30" y="476" width="940" height="160" rx="14" fill="#fff7ed" stroke="#fed7aa" stroke-width="1.2"/>
  <text x="56" y="506" font-size="14.5" font-weight="700" fill="#7c2d12">C · 写入</text>
  <text x="56" y="528" font-size="11.5" fill="#ea580c">create / update / delete</text>
  <g filter="url(#s4)">
    <rect x="190" y="512" width="120" height="56" rx="9" fill="#ffffff" stroke="#fdba74"/>
    <rect x="350" y="512" width="120" height="56" rx="9" fill="#ffffff" stroke="#fdba74"/>
    <rect x="510" y="512" width="120" height="56" rx="9" fill="#ffffff" stroke="#fdba74"/>
    <rect x="670" y="512" width="120" height="56" rx="9" fill="#ffffff" stroke="#fdba74"/>
    <rect x="830" y="512" width="120" height="56" rx="9" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  </g>
  <g font-size="12.5" fill="#7c2d12" text-anchor="middle" font-weight="600">
    <text x="250" y="545">命令</text>
    <text x="410" y="545">client</text>
    <text x="570" y="545">HTTP</text>
    <text x="730" y="545">服务器</text>
    <text x="890" y="545">刷新本地镜像</text>
  </g>
  <g stroke="#ea580c" stroke-width="1.6" marker-end="url(#a4)">
    <line x1="310" y1="540" x2="344" y2="540"/>
    <line x1="470" y1="540" x2="504" y2="540"/>
    <line x1="630" y1="540" x2="664" y2="540"/>
    <line x1="790" y1="540" x2="824" y2="540"/>
  </g>
  <text x="190" y="606" font-size="11.5" fill="#64748b">写入成功后必须失效或更新缓存，否则本地与服务器会分裂</text>

  <!-- 底部提示 -->
  <text x="500" y="668" text-anchor="middle" font-size="12.5" fill="#94a3b8">规则：调用方必须能通过 --data-source 明确选择 A 或 B；C 必须回写镜像</text>
</svg>
